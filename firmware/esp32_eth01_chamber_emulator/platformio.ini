[platformio]
default_envs = wt32-eth01

[env:wt32-eth01]
platform = espressif32@6.10.0
board = wt32-eth01
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -D ESP_EMULATOR_VERSION=\"0.1.0\"
build_unflags = -std=gnu++11
build_src_filter =
    -<*>
    +<main.cpp>
    +<emulator_protocol.cpp>

; Leonardo R3 + W5500 Shield V2.0 (same ICSP/D10/D4 as USB-UPS-Simulator)
[env:leonardo-w5500]
platform = atmelavr@5.1.0
board = leonardo
framework = arduino
lib_deps = arduino-libraries/Ethernet@2.0.2
monitor_speed = 115200
build_src_filter =
    -<*>
    +<leonardo_main.cpp>
    +<leonardo_core.cpp>
build_flags =
    -std=gnu++11
