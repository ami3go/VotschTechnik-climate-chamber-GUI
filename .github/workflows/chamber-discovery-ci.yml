name: Settings chamber discovery (offline)
on:
  pull_request:
    paths:
      - 'chamber_web/adapters/votsch.py'
      - 'chamber_web/pages/chamber_config.py'
      - 'chamber_web/main.py'
      - 'chamber_web/ui_pages.py'
      - 'requirements-hardware.txt'
      - 'tests/test_votsch_discovery.py'
      - 'tests/test_web_chamber_discovery.py'
      - '.github/workflows/chamber-discovery-ci.yml'
  push:
    branches: [main]
    paths:
      - 'chamber_web/adapters/votsch.py'
      - 'chamber_web/pages/chamber_config.py'
      - 'chamber_web/main.py'
      - 'chamber_web/ui_pages.py'
      - 'requirements-hardware.txt'
      - 'tests/test_votsch_discovery.py'
      - 'tests/test_web_chamber_discovery.py'
      - '.github/workflows/chamber-discovery-ci.yml'
permissions:
  contents: read
jobs:
  discovery-offline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install web and test packages
        run: |
          python -m pip install -r requirements-web.txt
          python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Adapter import boundary and offline discovery unit tests
        run: |
          python -m unittest discover -s tests -p "test_chamber_backend.py" -v
          python -m unittest discover -s tests -p "test_votsch_discovery.py" -v
      - name: Authenticated NiceGUI auto-detect and select smoke
        run: python -m pytest -q tests/test_web_chamber_discovery.py
