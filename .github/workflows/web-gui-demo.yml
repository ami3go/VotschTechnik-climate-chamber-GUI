name: NiceGUI demo scaffold checks

on:
  pull_request:
    paths:
      - "chamber_web/**"
      - "main.py"
      - "tests/test_web_*.py"
      - "requirements-web.txt"
      - ".github/workflows/web-gui-demo.yml"
  push:
    branches: [main]
    paths:
      - "chamber_web/**"
      - "main.py"
      - "tests/test_web_*.py"
      - "requirements-web.txt"
      - ".github/workflows/web-gui-demo.yml"

jobs:
  model-and-import:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install web dependencies
        run: python -m pip install -r requirements-web.txt
      - name: Compile Python sources
        run: python -m compileall -q chamber_web main.py
      - name: Profile validation and demo tests
        run: python -m unittest discover -s tests -p "test_web_*.py" -v
      - name: Import UI module
        run: python -c "import chamber_web.main; print('NiceGUI page loaded')"
