name: NiceGUI demo scaffold checks

on:
  pull_request:
    paths:
      - "chamber_web/**"
      - "docs/**"
      - "main.py"
      - "tests/test_web_*.py"
      - "tests/test_chamber_*.py"
      - "requirements-web.txt"
      - ".github/workflows/web-gui-demo.yml"
  push:
    branches: [main]
    paths:
      - "chamber_web/**"
      - "docs/**"
      - "main.py"
      - "tests/test_web_*.py"
      - "tests/test_chamber_*.py"
      - "requirements-web.txt"
      - ".github/workflows/web-gui-demo.yml"

jobs:
  model-and-import:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install web dependencies
        run: python -m pip install -r requirements-web.txt
      - name: Install UI test tools
        run: python -m pip install pytest pytest-asyncio
      - name: Install architecture lint
        run: python -m pip install ruff
      - name: Lint G01 port and tests
        run: python -m ruff check chamber_web/domain chamber_web/adapters chamber_web/services tests/test_chamber_backend.py --select E4,E7,E9,F
      - name: Contract and single-device safety unit tests
        run: python -m unittest discover -s tests -p "test_chamber_*.py" -v
      - name: Compile Python sources
        run: python -m compileall -q chamber_web main.py
      - name: Profile validation and demo tests
        run: python -m unittest discover -s tests -p "test_web_*.py" -v
      - name: Render dashboard in simulated NiceGUI client
        run: python -m pytest -q tests/test_web_ui.py
