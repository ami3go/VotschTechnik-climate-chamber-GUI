name: NiceGUI demo scaffold checks

on:
  pull_request:
    paths:
      - "chamber_web/**"
      - "docs/**"
      - "main.py"
      - "tests/test_web_*.py"
      - "tests/test_chamber_*.py"
      - "tests/test_profile_*.py"
      - "tests/test_security_*.py"
      - "tests/test_manual_*.py"
      - "requirements-web.txt"
      - "requirements-hardware.txt"
      - ".github/workflows/web-gui-demo.yml"
  push:
    branches: [main]
    paths:
      - "chamber_web/**"
      - "docs/**"
      - "main.py"
      - "tests/test_web_*.py"
      - "tests/test_chamber_*.py"
      - "tests/test_profile_*.py"
      - "tests/test_security_*.py"
      - "tests/test_manual_*.py"
      - "requirements-web.txt"
      - "requirements-hardware.txt"
      - ".github/workflows/web-gui-demo.yml"

jobs:
  model-and-import:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install web dependencies
        run: python -m pip install -r requirements-web.txt
      - name: Install UI test tools
        run: python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Install architecture lint
        run: python -m pip install ruff==0.17.0
      - name: Lint G01, G02 and G04 services and safety tests
        run: python -m ruff check chamber_web/domain chamber_web/adapters chamber_web/services chamber_web/pages chamber_web/persistence chamber_web/ui_pages.py chamber_web/ui_state.py tests/test_chamber_backend.py tests/test_chamber_controller.py tests/test_profile_storage.py tests/test_dashboard_service.py tests/test_web_views.py chamber_web/security tests/test_security_core.py tests/test_manual_control.py tests/test_manual_ui.py --select E4,E7,E9,F
      - name: Contract and single-device safety unit tests
        run: python -m unittest discover -s tests -p "test_chamber_*.py" -v
      - name: G02-A server-side telemetry and backend substitution tests
        run: python -m unittest discover -s tests -p "test_dashboard_service.py" -v
      - name: Canonical and legacy profile CSV/ZIP tests
        run: python -m unittest discover -s tests -p "test_profile_*.py" -v
      - name: G05 manual-control concurrency and vendor substitution tests
        run: python -m unittest discover -s tests -p "test_manual_control.py" -v
      - name: G08-min offline identity and adversarial transport tests
        run: python -m unittest discover -s tests -p "test_security_*.py" -v
      - name: G03-C service, import and revision regressions
        run: python -m pytest -q tests/test_profile_editor.py
      - name: G03-C authenticated NiceGUI editor browser smoke
        run: python -m pytest -q tests/test_web_profiles_ui.py
      - name: Compile Python sources
        run: python -m compileall -q chamber_web main.py
      - name: Profile validation and demo tests
        run: python -m unittest discover -s tests -p "test_web_*.py" -v
      - name: Render dashboard in simulated NiceGUI client
        run: python -m pytest -q tests/test_web_ui.py tests/test_web_pages_ui.py tests/test_manual_ui.py
