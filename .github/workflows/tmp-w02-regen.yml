name: Temporary W02 closure regeneration
on:
  push:
    branches: [feat/h03-a-typed-driver-adapter]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regen:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install closure build prerequisites
        run: python -m pip install -r requirements-web.txt -r requirements-w02-build.txt
      - name: Resolve and download the hash-locked closure
        run: >
          python -m scripts.w02_closure build
          --requirements requirements-web.txt
          --vcs-requirement requirements-hardware.txt
          --wheelhouse w02-wheelhouse
          --lock w02-closure-build/built.lock
          --manifest w02-closure-build/built-manifest.json
          --target win_amd64-cp312
          --version 1.0.0
      - name: Upload closure artifacts
        uses: actions/upload-artifact@v4
        with:
          name: w02-closure
          path: |
            w02-closure-build/built.lock
            w02-closure-build/built-manifest.json
          if-no-files-found: error
