name: H01 simulation-only Windows CI
on:
  push:
    branches: [feat/h01-hil-readiness]
  pull_request:
    paths:
      - 'chamber_web/hil/**'
      - 'tests/test_h01_simulation.py'
      - 'docs/H01_*'
      - '.github/workflows/h01-simulation-windows.yml'
jobs:
  h01-mock-only:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Mock-only G04/H01 tests
        run: python -m unittest discover -s tests -p "test_h01_simulation.py" -v
      - name: H01 compile
        run: python -m compileall -q chamber_web/hil tests/test_h01_simulation.py
