name: W02 offline release signature and tamper tests
on:
  pull_request:
    paths:
      - "scripts/w02_release.py"
      - "scripts/w02_target_verifier.py"
      - "scripts/verify_w02_release.ps1"
      - "tests/test_windows_packaging.py"
      - ".github/workflows/windows-packaging.yml"
      - ".github/workflows/h01-extended-ci.yml"
      - "docs/W02_OFFLINE_RELEASE.md"
      - "docs/W02_SECURITY_REVIEW.md"
      - "scripts/windows_manifest.py"
      - "tests/test_w02_release.py"
      - "requirements-w02-build.txt"
      - ".github/workflows/w02-release-validation.yml"
  workflow_dispatch:
jobs:
  signed-inventory:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Install offline-verifier test prerequisites
        run: python -m pip install -r requirements-web.txt -r requirements-w02-build.txt pytest==9.1.1 ruff==0.17.0
      - name: Lint
        run: python -m ruff check scripts/w02_release.py scripts/w02_target_verifier.py scripts/windows_manifest.py tests/test_w02_release.py --select E4,E7,E9,F
      - name: Adversarial release tests
        run: python -m pytest -q tests/test_w02_release.py tests/test_windows_packaging.py
      - name: Report gating
        run: echo "W02 release NO-GO - self-hosted offline clean-VM acceptance and trusted signature required"
