name: S2-02 combined regression baseline (order-independent)

# Stage 2 package S2-02: one job that runs the whole simulation suite in a
# single process, so cross-file test-order rot that per-file workflows cannot
# see (e.g. PR #70 breaking tests/test_profile_runtime.py) fails CI instead of
# merging green. Mirrors the local baseline recorded in
# test-evidence/s2-02/S2_02_REPORT.md. Real hardware is never involved:
# tests/hardware/ is excluded and CHAMBER_HIL_RUN_TESTS is never set.

on:
  pull_request:
    paths:
      - 'chamber_web/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements*.txt'
      - 'pytest.ini'
      - 'main.py'
      - '.github/workflows/s2-02-regression-ci.yml'
  push:
    branches: [main]
    paths:
      - 'chamber_web/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements*.txt'
      - 'pytest.ini'
      - 'main.py'
      - '.github/workflows/s2-02-regression-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-regression:
    name: Combined simulation suite / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.10'
          - os: windows-latest
            python: '3.12'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Bounded dependency install (simulated only)
        # cryptography is pinned explicitly (same version as
        # requirements-dev.txt, which may not yet contain it on older main)
        # so this workflow stays order-independent with respect to PR #72;
        # keep the two pins identical to avoid a pip resolution conflict.
        run: >-
          python -m pip install --disable-pip-version-check --timeout 60
          -r requirements-web.txt -r requirements-hardware.txt -r requirements-dev.txt
          cryptography==46.0.2
      - name: Combined suite (job timeout is FAIL)
        timeout-minutes: 25
        run: >-
          python -m pytest -q tests
          --ignore=tests/hardware
          --ignore=tests/test_h01_browser_e2e.py
          --junitxml=s2-02-junit.xml
      - name: Publish JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-02-regression-${{ matrix.os }}-${{ matrix.python }}
          path: s2-02-junit.xml
          if-no-files-found: ignore
