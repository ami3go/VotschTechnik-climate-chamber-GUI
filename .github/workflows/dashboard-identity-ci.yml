name: Dashboard chamber identity (offline)
on:
  pull_request:
    paths:
      - 'chamber_web/main.py'
      - 'chamber_web/ui_state.py'
      - 'chamber_web/assets/style.css'
      - 'tests/test_web_ui.py'
      - 'tests/test_web_views.py'
      - '.github/workflows/dashboard-identity-ci.yml'
  push:
    branches: [main]
    paths:
      - 'chamber_web/main.py'
      - 'chamber_web/ui_state.py'
      - 'chamber_web/assets/style.css'
      - 'tests/test_web_ui.py'
      - 'tests/test_web_views.py'
      - '.github/workflows/dashboard-identity-ci.yml'
permissions:
  contents: read
jobs:
  chamber-identity:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install NiceGUI and offline test tools
        run: |
          python -m pip install -r requirements-web.txt
          python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Unit-test chamber identity and other read models
        run: python -m unittest discover -s tests -p 'test_web_views.py' -v
      - name: Test authenticated Dashboard chamber card in browser
        run: python -m pytest -q tests/test_web_ui.py
