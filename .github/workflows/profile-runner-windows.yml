name: G06-A simulated profile runner Windows

on:
  pull_request:
    paths:
      - "chamber_web/execution/**"
      - "chamber_web/domain/**"
      - "chamber_web/services/**"
      - "chamber_web/persistence/**"
      - "tests/test_profile_runner.py"
      - ".github/workflows/profile-runner-windows.yml"
  workflow_dispatch:

jobs:
  simulated-runner:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test/lint tools
        run: python -m pip install pytest==9.1.1 ruff==0.17.0
      - name: Syntax and lint
        run: |
          python -m compileall -q chamber_web/execution tests/test_profile_runner.py
          python -m ruff check chamber_web/execution tests/test_profile_runner.py --select E4,E7,E9,F
      - name: Run G06 and G04/G03 regression tests
        run: python -m pytest -q tests/test_profile_runner.py tests/test_chamber_controller.py tests/test_profile_storage.py tests/test_chamber_backend.py tests/test_profile_schema.py
