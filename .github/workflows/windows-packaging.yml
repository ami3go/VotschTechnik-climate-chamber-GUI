name: W01-A Windows launcher and offline freeze feasibility

on:
  pull_request:
    paths:
      - "scripts/**"
      - "chamber_web/**"
      - "README_OFFLINE_WINDOWS.md"
      - "tests/test_windows_packaging.py"
      - ".github/workflows/windows-packaging.yml"
      - ".github/workflows/w02-release-validation.yml"
      - ".github/workflows/h01-extended-ci.yml"
      - "docs/W02_OFFLINE_RELEASE.md"
      - "docs/W02_SECURITY_REVIEW.md"
      - "requirements-web.txt"
      - "requirements-hardware.txt"
      - "requirements-w02-runtime.lock"
      - "w02-closure-manifest.json"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "chamber_web/**"
      - "README_OFFLINE_WINDOWS.md"
      - "tests/test_windows_packaging.py"
      - ".github/workflows/windows-packaging.yml"
      - "requirements-web.txt"
      - "requirements-hardware.txt"
      - "requirements-w02-runtime.lock"
      - "w02-closure-manifest.json"
  workflow_dispatch:

jobs:
  windows-freeze:
    name: Windows x64 PyInstaller + simulated launch
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CHAMBER_PORT: "18765"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install W01 test tools
        run: python -m pip install -r requirements-web.txt -r requirements-w02-build.txt pyinstaller==6.16.0 pytest==9.1.1 ruff==0.17.0
      - name: Lint Windows code
        run: python -m ruff check chamber_web/windows_runtime.py scripts/windows_launcher.py scripts/windows_server.py scripts/windows_manifest.py tests/test_windows_packaging.py --select E4,E7,E9,F
      - name: Unit tests and Python syntax
        run: |
          python -m compileall -q chamber_web/windows_runtime.py scripts tests/test_windows_packaging.py
          python -m pytest -q tests/test_windows_packaging.py
      - name: Standalone launcher build
        shell: pwsh
        run: |
          & ./scripts/build_windows_launcher.ps1 -Clean -Version 0.1.0-w01 -OutputDir "$env:RUNNER_TEMP/thin-launcher"
          if (-not (Test-Path "$env:RUNNER_TEMP/thin-launcher/ClimateChamberLauncher.exe")) { throw "Thin launcher missing" }
      - name: Frozen offline ZIP including pinned external driver
        shell: pwsh
        run: |
          & ./scripts/build_windows_offline.ps1 -Clean -Version 0.1.0-w01 -OutputDir "$env:RUNNER_TEMP/bundles"
          if (-not (Test-Path "$env:RUNNER_TEMP/bundles/ClimateChamber-Web-Windows-x64-0.1.0-w01-offline.zip")) { throw "Offline archive missing" }
      - name: Frozen offline ZIP built from the reviewed dependency closure
        shell: pwsh
        run: |
          # The release path: the runtime is installed from the reviewed,
          # hash-locked closure with no index access, so the frozen bundle
          # contains exactly the reviewed artifacts.
          & ./scripts/build_windows_offline.ps1 -Clean -Version 0.1.0-w01-closure `
              -OutputDir "$env:RUNNER_TEMP/bundles-closure" -UseReviewedClosure
          $closureZip = "$env:RUNNER_TEMP/bundles-closure/ClimateChamber-Web-Windows-x64-0.1.0-w01-closure-offline.zip"
          if (-not (Test-Path $closureZip)) { throw "Closure-built archive missing" }
          # The build only keeps the archive; verify the extracted bundle.
          $closureExtract = "$env:RUNNER_TEMP/closure-extracted"
          Expand-Archive -LiteralPath $closureZip -DestinationPath $closureExtract
          $bundle = Join-Path $closureExtract "ClimateChamber-Web-Windows-x64-0.1.0-w01-closure-offline"
          python ./scripts/windows_manifest.py --bundle $bundle --verify
          if ($LASTEXITCODE -ne 0) { throw "Closure-built manifest verification failed" }
          $manifest = Get-Content "$bundle/build-manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.dependency_closure -ne "VERIFIED-HASH-LOCKED") { throw "The closure-built bundle does not record a verified closure" }
          $expected = (Get-FileHash -Algorithm SHA256 "./requirements-w02-runtime.lock").Hash.ToLowerInvariant()
          if ($manifest.dependency_closure_sha256 -ne $expected) { throw "The recorded closure digest is not the reviewed lock" }
          $server = "$bundle/server/ClimateChamberServer.exe"
          & $server --self-test --require-module VotschTechnikClimateChamber
          if ($LASTEXITCODE -ne 0) { throw "Closure-built vendor package / adapter self-test failed" }
      - name: Extract, run, reuse, and reject foreign listener
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "$env:RUNNER_TEMP/bundles/ClimateChamber-Web-Windows-x64-0.1.0-w01-offline.zip"
          $expected = ((Get-Content "$zip.sha256") -split " ")[0]
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Offline archive digest mismatch" }
          $extract = "$env:RUNNER_TEMP/offline-extracted"
          Expand-Archive -LiteralPath $zip -DestinationPath $extract
          $bundle = Join-Path $extract "ClimateChamber-Web-Windows-x64-0.1.0-w01-offline"
          python ./scripts/windows_manifest.py --bundle "$bundle" --verify
          if (-not (Test-Path (Join-Path $bundle "create_windows_shortcuts.ps1"))) { throw "Offline shortcut configurator missing" }
          if ($LASTEXITCODE -ne 0) { throw "Manifest verification failed" }
          $server = Join-Path $bundle "server/ClimateChamberServer.exe"
          & $server --self-test --require-module VotschTechnikClimateChamber
          if ($LASTEXITCODE -ne 0) { throw "Vendor package / adapter self-test failed" }
          $launcher = Join-Path $bundle "ClimateChamberLauncher.exe"
          try {
            $firstLaunch = Start-Process -FilePath $launcher -ArgumentList "--no-browser" -PassThru
            if (-not $firstLaunch.WaitForExit(60000)) { Stop-Process -Id $firstLaunch.Id -Force; throw "Launcher did not exit" }
            if ($firstLaunch.ExitCode -ne 0) { throw "Initial launcher failed: $($firstLaunch.ExitCode)" }
            $instancePath = Join-Path $env:LOCALAPPDATA "ClimateChamber/W01/instance.json"
            $first = Get-Content $instancePath -Raw | ConvertFrom-Json
            $secondLaunch = Start-Process -FilePath $launcher -ArgumentList @("--no-browser", "--check-only") -PassThru
            if (-not $secondLaunch.WaitForExit(60000)) { Stop-Process -Id $secondLaunch.Id -Force; throw "Second launcher did not exit" }
            if ($secondLaunch.ExitCode -ne 0) { throw "Launcher attach failed: $($secondLaunch.ExitCode)" }
            $duplicate = Start-Process -FilePath $server -ArgumentList @("--port", "$env:CHAMBER_PORT") -PassThru -WindowStyle Hidden
            if (-not $duplicate.WaitForExit(15000)) { Stop-Process -Id $duplicate.Id -Force; throw "Second server hung instead of rejecting lock" }
            if ($duplicate.ExitCode -eq 0) { throw "Second server bypassed process lock" }
            $second = Get-Content $instancePath -Raw | ConvertFrom-Json
            if ($first.pid -ne $second.pid) { throw "Duplicate server created" }
            $page = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$env:CHAMBER_PORT/"
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch "Climate Chamber") {
              throw "Frozen loopback page not reachable"
            }
          }
          finally {
            if (Test-Path (Join-Path $env:LOCALAPPDATA "ClimateChamber/W01/instance.json")) {
              $running = Get-Content (Join-Path $env:LOCALAPPDATA "ClimateChamber/W01/instance.json") -Raw | ConvertFrom-Json
              Stop-Process -Id $running.pid -Force -ErrorAction SilentlyContinue
            }
          }
          Start-Sleep -Seconds 2
          $foreign = Start-Process python -ArgumentList "-m http.server $env:CHAMBER_PORT --bind 127.0.0.1" -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 2
            $foreignLaunch = Start-Process -FilePath $launcher -ArgumentList "--no-browser" -PassThru
            if (-not $foreignLaunch.WaitForExit(60000)) { Stop-Process -Id $foreignLaunch.Id -Force; throw "Foreign-port launch hung" }
            if ($foreignLaunch.ExitCode -eq 0) { throw "Foreign port incorrectly accepted" }
          }
          finally { Stop-Process -Id $foreign.Id -Force -ErrorAction SilentlyContinue }
      - name: W02 signed frozen-bundle integration (ephemeral TEST key, not a release)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = Join-Path "$env:RUNNER_TEMP/offline-extracted" "ClimateChamber-Web-Windows-x64-0.1.0-w01-offline"
          $env:W02_CI_PRIVATE = Join-Path $env:RUNNER_TEMP "w02-ci-private.pem"
          $env:W02_CI_PUBLIC = Join-Path $env:RUNNER_TEMP "w02-ci-public.pem"
          @'
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          key = Ed25519PrivateKey.generate()
          Path(os.environ["W02_CI_PRIVATE"]).write_bytes(key.private_bytes(
              serialization.Encoding.PEM, serialization.PrivateFormat.PKCS8,
              serialization.NoEncryption()))
          Path(os.environ["W02_CI_PUBLIC"]).write_bytes(key.public_key().public_bytes(
              serialization.Encoding.PEM, serialization.PublicFormat.SubjectPublicKeyInfo))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "CI-only Ed25519 key generation failed" }
          try {
            python -m scripts.w02_release --sign --bundle "$bundle" --version 0.1.0-w01 --source-sha ("0" * 64) --private-key "$env:W02_CI_PRIVATE"
            if ($LASTEXITCODE -ne 0) { throw "Signing frozen W01 bundle failed" }
            python -m scripts.w02_release --verify --bundle "$bundle" --public-key "$env:W02_CI_PUBLIC" --min-version 0.1.0-w01
            if ($LASTEXITCODE -ne 0) { throw "Verifying signed frozen W01 bundle failed" }
            $unlisted = Join-Path $bundle "unexpected-w02-ci-file.dll"
            [IO.File]::WriteAllBytes($unlisted, [byte[]](1,2,3))
            python -m scripts.w02_release --verify --bundle "$bundle" --public-key "$env:W02_CI_PUBLIC" *> $null
            if ($LASTEXITCODE -eq 0) { throw "Signed release accepted an unexpected DLL" }
            Remove-Item -LiteralPath $unlisted -Force
            python -m scripts.w02_release --verify --bundle "$bundle" --public-key "$env:W02_CI_PUBLIC"
            if ($LASTEXITCODE -ne 0) { throw "Signed release recovery verification failed" }

            # This is a SECOND verified tool, not a second chamber launcher.
            # The publisher/test key is not shipped in the uploaded W01 artifact.
            $exeFolder = Join-Path $env:RUNNER_TEMP "w02-ci-verifier-bin"
            python -m PyInstaller --noconfirm --clean --onefile --console --name ClimateChamberReleaseVerifier --paths . --distpath "$exeFolder" --workpath "$env:RUNNER_TEMP/w02-ci-verifier-build" --specpath "$env:RUNNER_TEMP/w02-ci-verifier-spec" "./scripts/w02_target_verifier.py"
            if ($LASTEXITCODE -ne 0) { throw "Frozen independent verifier build failed" }
            $verifierExe = Join-Path $exeFolder "ClimateChamberReleaseVerifier.exe"
            if (-not (Test-Path -LiteralPath $verifierExe -PathType Leaf)) { throw "Frozen verifier missing" }
            $ciPin = (Get-FileHash -LiteralPath $verifierExe -Algorithm SHA256).Hash.ToLowerInvariant()
            $ciArchive = Join-Path $env:RUNNER_TEMP "w02-CI-ONLY-signed-test.zip"
            Compress-Archive -Path "$bundle" -DestinationPath "$ciArchive" -CompressionLevel Optimal
            $isolatedInstall = Join-Path $env:RUNNER_TEMP "w02-ci-verified-install"
            $psVersion = (powershell.exe -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()').Trim()
            if ($LASTEXITCODE -ne 0 -or -not $psVersion.StartsWith("5.1")) {
              throw "Windows PowerShell 5.1 unavailable on test runner"
            }
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "./scripts/verify_w02_release.ps1" -Archive "$ciArchive" -InstallDir "$isolatedInstall" -VerifierPath "$verifierExe" -VerifierSha256 "$ciPin" -TrustedPublicKey "$env:W02_CI_PUBLIC" -MinimumVersion "0.1.0-w01"
            if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 frozen-verifier integration failed" }
            if (-not (Test-Path -LiteralPath (Join-Path $isolatedInstall "ClimateChamberLauncher.exe") -PathType Leaf)) {
              throw "Independently verified frozen launcher not staged"
            }
            $rejected = Join-Path $env:RUNNER_TEMP "w02-ci-rejected-install"
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "./scripts/verify_w02_release.ps1" -Archive "$ciArchive" -InstallDir "$rejected" -VerifierPath "$verifierExe" -VerifierSha256 ("f" * 64) -TrustedPublicKey "$env:W02_CI_PUBLIC" -MinimumVersion "0.1.0-w01" *> $null
            if ($LASTEXITCODE -eq 0 -or (Test-Path -LiteralPath $rejected)) {
              throw "Wrong independently pinned verifier digest was accepted"
            }
            # PowerShell preserves the expected failing native exit code.
            # Clear it only AFTER the negative assertion, or Actions marks this job failed.
            $global:LASTEXITCODE = 0
          }
          finally {
            Remove-Item -LiteralPath "$env:W02_CI_PRIVATE" -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath "$env:W02_CI_PUBLIC" -Force -ErrorAction SilentlyContinue
          }
          Write-Host "CI-only signing and tamper rejection passed; artifact remains UNSIGNED/UNTRUSTED W01 simulator."
      - name: Upload W01 simulator artifact (NOT release)
        uses: actions/upload-artifact@v4
        with:
          name: W01-A-simulator-Windows-x64-not-certified
          path: |
            ${{ runner.temp }}/bundles/*.zip
            ${{ runner.temp }}/bundles/*.sha256
          retention-days: 7
