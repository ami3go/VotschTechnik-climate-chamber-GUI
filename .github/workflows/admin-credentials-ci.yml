name: Administrator credential persistence (offline)
on:
  pull_request:
    paths:
      - 'chamber_web/security/nicegui.py'
      - 'chamber_web/security/auth.py'
      - 'chamber_web/security/account_ops.py'
      - 'chamber_web/security/paths.py'
      - 'chamber_web/main.py'
      - 'tests/test_security_factory_credentials.py'
      - 'tests/test_web_factory_admin_ui.py'
      - '.github/workflows/admin-credentials-ci.yml'
  push:
    branches: [main]
    paths:
      - 'chamber_web/security/nicegui.py'
      - 'chamber_web/security/auth.py'
      - 'chamber_web/security/account_ops.py'
      - 'chamber_web/security/paths.py'
      - 'chamber_web/main.py'
      - 'tests/test_security_factory_credentials.py'
      - 'tests/test_web_factory_admin_ui.py'
      - '.github/workflows/admin-credentials-ci.yml'
permissions:
  contents: read
jobs:
  credentials:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install offline test environment
        run: |
          python -m pip install -r requirements-web.txt
          python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Verify secure SQLite restart and separate PIN status
        run: python -m unittest discover -s tests -p 'test_security_factory_credentials.py' -v
      - name: Verify Admin password change and restart in simulated NiceGUI
        run: python -m pytest -q tests/test_web_factory_admin_ui.py
