name: G07-A run recording Windows validation

on:
  pull_request:
    paths:
      - "chamber_web/persistence/runs.py"
      - "tests/test_run_recording.py"
      - "tests/test_run_recording_integration.py"
      - "docs/G07_A_RUN_RECORDING_CONTRACT.md"
      - ".github/workflows/g07-run-recording.yml"
  push:
    branches: [main]
    paths:
      - "chamber_web/persistence/runs.py"
      - "tests/test_run_recording.py"
      - ".github/workflows/g07-run-recording.yml"

jobs:
  recording:
    name: Windows Python ${{ matrix.python-version }} recorder
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lint
        run: python -m pip install ruff==0.17.0
      - name: Static architecture and syntax check
        run: |
          python -m compileall -q chamber_web/persistence/runs.py tests/test_run_recording.py tests/test_run_recording_integration.py
          python -m ruff check chamber_web/persistence/runs.py tests/test_run_recording.py tests/test_run_recording_integration.py --select E4,E7,E9,F
      - name: Durable recorder fault tests
        run: python -m unittest discover -s tests -p "test_run_recording.py" -v
      - name: Merged G06 runner integration (Fake and alternative stub)
        run: python -m unittest discover -s tests -p "test_run_recording_integration.py" -v
      - name: G06 upstream runner regressions
        run: python -m unittest discover -s tests -p "test_profile_runner.py" -v
      - name: G04 exclusive controller and STOP-fencing regressions
        run: python -m unittest discover -s tests -p "test_chamber_controller.py" -v
      - name: G08-min auth/session/CSRF and profile authorization regressions
        run: |
          python -m unittest discover -s tests -p "test_security_core.py" -v
          python -m unittest discover -s tests -p "test_profile_security_integration.py" -v
      - name: Driver boundary (no direct hardware/UI import)
        shell: pwsh
        run: |
          $text = Get-Content chamber_web/persistence/runs.py -Raw
          if ($text -match '(^|\n)\s*(from|import)\s+(nicegui|Votsch|chamber_web\.adapters|socket)') {
            throw 'G07 recorder must never import UI, protocol, or vendor drivers'
          }

  million-samples:
    name: Windows million-sample SQLite recovery
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify a real one-million-sample run and artifact checksums
        env:
          G07_STRESS: "1"
        run: python -m unittest tests.test_run_recording.RecorderTests.test_one_million_samples_real_sqlite_and_bounded_plot -v
