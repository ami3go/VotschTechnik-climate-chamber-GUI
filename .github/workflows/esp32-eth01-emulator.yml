name: ESP-EMU-01 emulator regression
on:
  pull_request:
    paths:
      - 'firmware/esp32_eth01_chamber_emulator/**'
      - 'docs/ESP32_ETH01_EMULATOR*'
      - '.github/workflows/esp32-eth01-emulator.yml'
  push:
    branches:
      - feat/esp32-eth01-chamber-emulator
    paths:
      - 'firmware/esp32_eth01_chamber_emulator/**'
      - '.github/workflows/esp32-eth01-emulator.yml'
permissions:
  contents: read

jobs:
  native-driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ami3go/VotschTechnik-climate-chamber-Python
          ref: b56cfbd54570e66cddf83106505487d3b19d9677
          path: external-driver
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install driver runtime dependency
        run: python -m pip install colorama==0.4.6
      - name: Build native C++ engine and TCP test endpoint
        run: |
          mkdir -p firmware/esp32_eth01_chamber_emulator/build
          python scripts/h02_watchdog_command.py --timeout-s 120 --idle-timeout-s 60 --log-dir test-evidence/esp32-emulator/native-build -- \
            bash -c 'set -euo pipefail; d=firmware/esp32_eth01_chamber_emulator; g++ -std=c++17 -Wall -Wextra -Werror -I"$d/include" "$d/src/emulator_protocol.cpp" "$d/test/host/test_emulator.cpp" -o "$d/build/test_emulator"; g++ -std=c++17 -Wall -Wextra -Werror -I"$d/include" "$d/src/emulator_protocol.cpp" "$d/test/host/tcp_reference.cpp" -o "$d/build/tcp_reference"'
      - name: Golden host tests
        run: |
          python scripts/h02_watchdog_command.py --timeout-s 120 --idle-timeout-s 60 --log-dir test-evidence/esp32-emulator/native-test -- \
            firmware/esp32_eth01_chamber_emulator/build/test_emulator
      - name: Maintained Python driver over real TCP socket
        run: |
          python scripts/h02_watchdog_command.py --timeout-s 180 --idle-timeout-s 70 --log-dir test-evidence/esp32-emulator/driver -- \
            python -m unittest discover -v -s firmware/esp32_eth01_chamber_emulator/test/integration -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esp32-emulator-native-evidence
          path: test-evidence/esp32-emulator/
          if-no-files-found: warn

  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned PlatformIO Core
        run: python -m pip install platformio==6.1.18
      - name: Compile WT32-ETH01 target with watchdog
        run: |
          python scripts/h02_watchdog_command.py --timeout-s 1200 --idle-timeout-s 300 --log-dir test-evidence/esp32-emulator/firmware-build -- \
            pio run -d firmware/esp32_eth01_chamber_emulator
      - name: Record actual firmware hash
        run: |
          sha256sum firmware/esp32_eth01_chamber_emulator/.pio/build/wt32-eth01/firmware.bin > firmware-sha256.txt
          cat firmware-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esp32-emulator-firmware
          path: |
            firmware/esp32_eth01_chamber_emulator/.pio/build/wt32-eth01/firmware.bin
            firmware-sha256.txt
            test-evidence/esp32-emulator/
          if-no-files-found: warn
